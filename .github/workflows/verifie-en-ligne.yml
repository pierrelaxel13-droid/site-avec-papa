# ==========================================================================
# Le site publié est-il bien celui qu'on a poussé — et répond-il correctement ?
# --------------------------------------------------------------------------
# L'environnement de développement n'atteint pas le site en ligne : sa
# politique réseau le refuse. Personne ne peut donc y ouvrir le site pour vérifier.
# Les machines de GitHub, elles, ont un accès libre. Cette action est donc le
# seul endroit d'où l'on puisse constater ce qui est réellement en ligne, et
# elle le dit en annotations, lisibles sans ouvrir le journal.
#
# Elle ne publie rien et ne corrige rien : elle constate.
# ==========================================================================
name: Vérifier le site en ligne

on:
  # Après chaque publication (code ou relève), et quatre fois par jour.
  workflow_run:
    workflows: ["Publier le site"]
    types: [completed]
  schedule:
    - cron: "23 */6 * * *"   # quatre fois par jour, pour attraper aussi les
                             # relèves, qui ne déclenchent pas « push »
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifie-en-ligne
  cancel-in-progress: true

# Depuis le 27 octobre 2026, le site est publié par GitHub Pages
# (.github/workflows/publie.yml) : le quota de Netlify était épuisé.
env:
  SITE: https://pierrelaxel13-droid.github.io/site-avec-papa

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # On compare version.txt au dernier commit de main. La publication vient
      # de finir, mais le cache de GitHub Pages peut garder l'ancienne version
      # quelques minutes : on attend, sans dépasser six minutes.
      - name: Le site en ligne est-il à jour
        id: version
        run: |
          git fetch -q origin main
          attendu=$(git rev-parse origin/main)
          echo "commit attendu : $attendu"
          for i in $(seq 1 24); do
            enligne=$(curl -sS --max-time 20 "$SITE/version.txt" | head -1 || true)
            echo "  essai $i — en ligne : ${enligne:-rien}"
            [ "$enligne" = "$attendu" ] && { echo "a_jour=oui" >> "$GITHUB_OUTPUT"; exit 0; }
            sleep 15
          done
          echo "a_jour=non" >> "$GITHUB_OUTPUT"
          echo "::error::Six minutes après l'envoi, $SITE sert encore « ${enligne:-rien} » au lieu de $attendu. La publication (« Publier le site ») a échoué, ou elle n'a pas été déclenchée."
          exit 1

      # Le site peut être à jour et mal servi. On regarde donc ce que valent
      # quelques pages, et si la politique de sécurité est bien dans les pages.
      - name: Les pages répondent-elles
        if: always() && steps.version.outputs.a_jour == 'oui'
        run: |
          faute=0
          for p in / /decouvrir.html /le-site.html /nous.html /metiers.html \
                   /abonnement.html /connexion.html /app/index.html \
                   /app/releve.html /app/secteurs.html /assets/site.css \
                   /assets/amorce.js; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$SITE$p" || echo 000)
            echo "  $code  $p"
            [ "$code" = "200" ] || { echo "::error::$p répond $code"; faute=1; }
          done
          exit $faute

      # GitHub Pages n'envoie pas d'en-têtes choisis : la politique est écrite
      # dans chaque page (balise meta, posée par build.mjs).
      - name: La politique de sécurité est-elle dans les pages
        if: always() && steps.version.outputs.a_jour == 'oui'
        run: |
          faute=0
          for p in / /app/index.html /le-site.html; do
            csp=$(curl -sS --max-time 30 "$SITE$p" | grep -o '<meta http-equiv="Content-Security-Policy" content="[^"]*"' || true)
            [ -n "$csp" ] || { echo "::error::$p n'a plus sa politique de sécurité"; faute=1; continue; }
            # La règle qui compte : aucun script écrit dans le HTML.
            case "$csp" in
              *"script-src 'self';"*) echo "  ok      $p : script-src 'self'" ;;
              *) echo "::error::$p — la politique ne porte plus script-src 'self' seul : $csp"; faute=1 ;;
            esac
          done
          exit $faute

      - name: Ce qu'on a constaté
        if: always()
        run: |
          if [ "${{ steps.version.outputs.a_jour }}" = "oui" ]; then
            echo "::notice::$SITE sert bien le dernier commit de main."
          fi
