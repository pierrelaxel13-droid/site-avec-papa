# ==========================================================================
# Pierrel & Co — la relève automatique
# --------------------------------------------------------------------------
# « Idéalement ce serait tout le temps, chaque seconde. » Ça ne servirait à
# rien, et ça nous ferait couper l'accès aux sources. Voici pourquoi, et ce
# qu'on fait à la place.
#
# À QUEL RYTHME LES SOURCES BOUGENT, VRAIMENT
#   Journal officiel   une fois par jour, publié au petit matin.
#   Codes consolidés   une fois par jour : la base LEGI est reconstruite la nuit.
#   Flux des autorités quelques fois par jour, au gré des publications.
# Interroger chaque seconde, c'est 86 400 requêtes par jour pour, au mieux,
# une nouveauté — et un blocage assuré par les serveurs publics.
#
# CE QU'ON FAIT
#   toutes les heures  les 25 sources d'actualité, sur quatorze jours glissants.
#   une fois par jour  les codes consolidés (lourd : 12 Mo à télécharger),
#                      juste après que la base LEGI a été reconstruite.
# Le délai maximum entre la parution d'un texte et l'alerte est donc d'une
# heure. C'est déjà plus serré que le rythme des sources elles-mêmes.
#
# COMMENT ÇA ATTEINT LE SITE
# Quand la relève change quelque chose, l'action le commite — contenu/ est
# suivi par git, relevé compris. « Publier le site » (publie.yml) part à la
# fin de la relève et republie, sans rien
# relever lui-même : le site affiche exactement ce qui est dans l'historique.
# Rien à régler ailleurs, aucune clé à poser.
# ==========================================================================
name: Relève

on:
  schedule:
    - cron: "17 * * * *"      # toutes les heures, à 17 — pas à l'heure pile,
                              # où tout le monde tape en même temps
    - cron: "42 5 * * *"      # une fois par jour, 5 h 42 UTC ≈ 7 h 42 à Paris
  workflow_dispatch:           # et à la demande, depuis l'onglet Actions

# Le robot n'a besoin que d'une chose : écrire dans ce dépôt. Tout le reste
# lui est refusé, pour que le jeton qu'il porte ne serve à rien d'autre si
# quelque chose tournait mal pendant un passage.
permissions:
  contents: write

concurrency:
  group: releve
  cancel-in-progress: false

jobs:
  relever:
    runs-on: ubuntu-latest
    steps:
      # Les actions sont épinglées sur un commit précis, pas sur « v4 ».
      # Une étiquette peut être déplacée ; un commit, non. En échange elles ne
      # se mettent plus à jour toutes seules : la version est écrite à côté
      # pour qu'on sache quoi relever, et c'est à faire à la main de temps en
      # temps — https://github.com/actions/checkout/releases
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Les contrôles de vraisemblance (outils/controles.mjs) sont testés à
      # chaque passage : un contrôle cassé ne doit jamais se taire.
      - name: Les contrôles du robot, testés
        run: |
          echo "DEBUT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          node outils/controles.test.mjs
          node outils/tri.test.mjs
          node outils/conseils.test.mjs

      # La Haute Autorité de santé envoie son certificat sans le certificat
      # intermédiaire qui le relie à une autorité reconnue. Un navigateur va le
      # chercher tout seul ; Node, non, et refuse la connexion. On fait ce que
      # fait le navigateur : on télécharge l'intermédiaire à l'adresse que le
      # certificat indique lui-même, et on ne le garde que si une autorité
      # racine du système l'a signé ET qu'il signe bien le certificat du site.
      # La vérification n'est jamais coupée : on lui donne la pièce qui manque.
      - name: Compléter les chaînes de certificats incomplètes
        run: |
          ca="$RUNNER_TEMP/ca"; mkdir -p "$ca"; : > "$ca/intermediaires.pem"
          racines=/etc/ssl/certs/ca-certificates.crt
          for hote in www.has-sante.fr; do
            echo | openssl s_client -connect "$hote:443" -servername "$hote" 2>/dev/null \
              | openssl x509 > "$ca/feuille.pem" 2>/dev/null || { echo "$hote : pas de certificat lu"; continue; }
            aia=$(openssl x509 -in "$ca/feuille.pem" -noout -text | grep -m1 'CA Issuers - URI:' | sed 's/.*URI://')
            [ -n "$aia" ] || { echo "$hote : le certificat n'indique pas son intermédiaire"; continue; }
            curl -fsS --max-time 20 "$aia" -o "$ca/inter.brut" || { echo "$hote : intermédiaire introuvable"; continue; }
            openssl x509 -inform DER -in "$ca/inter.brut" -out "$ca/inter.pem" 2>/dev/null \
              || openssl x509 -in "$ca/inter.brut" -out "$ca/inter.pem" 2>/dev/null \
              || { echo "$hote : intermédiaire illisible"; continue; }
            if openssl verify -CAfile "$racines" "$ca/inter.pem" > /dev/null \
               && openssl verify -CAfile "$racines" -untrusted "$ca/inter.pem" "$ca/feuille.pem" > /dev/null; then
              cat "$ca/inter.pem" >> "$ca/intermediaires.pem"
              echo "$hote : chaîne complétée — $(openssl x509 -in "$ca/inter.pem" -noout -subject)"
            else
              echo "::warning::$hote : l'intermédiaire téléchargé ne se vérifie pas, il n'est pas utilisé."
            fi
          done
          if [ -s "$ca/intermediaires.pem" ]; then
            echo "NODE_EXTRA_CA_CERTS=$ca/intermediaires.pem" >> "$GITHUB_ENV"
          fi

      # À la demande seulement : interroger les 25 sources une par une et écrire
      # qui répond, pour que celles qui portent « confirme: true » soient
      # revérifiées contre le vrai serveur. Le rapport reste dans le dépôt.
      - name: Vérifier les sources une par une
        if: github.event_name == 'workflow_dispatch'
        run: |
          node outils/veille.mjs --verifier 2>&1 | tee contenu/sources-rapport.txt
          echo "::notice::$(grep -c 'répond' contenu/sources-rapport.txt) source(s) répondent."

      # À la demande seulement, aussi : pour chaque source muette, demander au
      # site lui-même où est son flux (liens déclarés par ses pages, chemins
      # courants). Le bilan reste dans contenu/sources-decouverte.json ; on ne
      # change contenu/sources.js qu'à la main, après l'avoir lu.
      - name: Chercher le flux des sources muettes
        if: github.event_name == 'workflow_dispatch'
        run: |
          node outils/veille.mjs --decouvrir 2>&1 | tee contenu/sources-decouverte.txt
          echo "::notice::$(tail -1 contenu/sources-decouverte.txt)"

      # Les flux et le Journal officiel : à chaque passage. Un échec ne doit
      # pas arrêter la relève, mais il doit se voir dans le journal du passage.
      - name: Les textes qui paraissent
        run: |
          node outils/veille.mjs --jours 14 2>&1 | tee releve-flux.log || \
            echo "::warning::Relève des flux : $(tail -c 500 releve-flux.log | tr '\n' ' ')"

      # Les conseils de l'IA (Perplexity), une fois par nouveau texte, avec ses
      # garde-fous (outils/conseils.mjs). Sans le secret PERPLEXITY_API_KEY, rien
      # n'est demandé ; une erreur ne doit jamais arrêter la relève.
      - name: Les conseils de l'IA
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          CONSEILS_PLAFOND: "10"
        run: node outils/conseils.mjs || echo "::warning::Les conseils de l'IA n'ont pas pu être demandés à ce passage."

      # Les codes consolidés : une fois par jour seulement. contenu/codes.json
      # est suivi par git, et c'est en le comparant que le robot sait ce qui a
      # changé — d'où le commit, qui fait la mémoire.
      - name: Le texte des codes
        if: github.event.schedule == '42 5 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          node outils/codes.mjs 2>&1 | tee releve-codes.log || \
            echo "::warning::Relève des codes : $(tail -c 500 releve-codes.log | tr '\n' ' ')"

      # On ne construit pas pour publier — publie.yml s'en charge — mais pour
      # refuser de commiter des données que le site ne saurait pas rendre.
      # Si la construction refuse les données relevées, il faut lire pourquoi
      # sans ouvrir le journal : le message part en annotation du passage.
      - name: Vérifier que le site se construit
        run: |
          if ! node build.mjs > construction.log 2>&1; then
            echo "::error::build.mjs refuse la relève — $(tail -c 900 construction.log | tr '\n' ' ')"
            cat construction.log
            exit 1
          fi
          cat construction.log

      # Quand la relève ne ramène rien — c'est le cas la plupart des heures —
      # le code qui ne s'allume qu'avec des textes relevés n'est pas exercé.
      # C'est par là qu'une fonction manquante est passée jusqu'ici. On
      # construit donc aussi avec un jeu d'essai qui a la forme d'une vraie
      # relève, puis on remet ce qui avait été relevé pour de bon.
      - name: Vérifier que le site tient avec une relève
        run: |
          cp contenu/veille-releve.json vraie-releve.json 2>/dev/null || true
          cp outils/releve-exemple.json contenu/veille-releve.json
          if ! node build.mjs > construction-essai.log 2>&1; then
            echo "::error::build.mjs refuse une relève bien formée — $(tail -c 900 construction-essai.log | tr '\n' ' ')"
            cat construction-essai.log
            exit 1
          fi
          if [ -f vraie-releve.json ]; then
            mv vraie-releve.json contenu/veille-releve.json
          else
            rm -f contenu/veille-releve.json
          fi
          node build.mjs > /dev/null

      - name: Commiter ce qui a bougé
        run: |
          rm -f construction.log construction-essai.log releve-flux.log vraie-releve.json
          if [ -z "$(git status --porcelain contenu/)" ]; then
            echo "Rien n'a changé : pas de commit."
            exit 0
          fi
          git config user.name  "Relève Pierrel & Co"
          git config user.email "releve@users.noreply.github.com"
          taille=$(du -k contenu/veille-releve.json 2>/dev/null | cut -f1 || echo 0)
          if [ "$taille" -gt 5120 ]; then
            echo "::warning::Le relevé pèse ${taille} Ko — réduire la fenêtre de --jours."
          fi
          git add contenu/
          git commit -m "Relève du $(date -u +%d/%m/%Y\ à\ %H:%M) UTC"
          git push

      # Le journal : une ligne par passage dans la base (table collectes), même
      # si le passage a échoué. Une alerte grave fait échouer l'action — donc
      # un courriel — mais au passage du matin seulement : un par jour au plus.
      - name: Inscrire le passage au journal (et prévenir si c'est grave)
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          QUOTIDIEN: ${{ (github.event.schedule == '42 5 * * *' || github.event_name == 'workflow_dispatch') && 'oui' || 'non' }}
          ETAT_DU_PASSAGE: ${{ job.status }}
          CODES_LOG: releve-codes.log
        run: node outils/journal-collecte.mjs
