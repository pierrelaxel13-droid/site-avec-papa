# ==========================================================================
# Vigie — la base de données (Supabase)
# --------------------------------------------------------------------------
# À chaque changement dans supabase/ (ou du référentiel : les 44 domaines) :
#   1. « tester »   rejoue TOUTES les migrations sur une base PostgreSQL vide,
#                   puis les tests d'isolation (supabase/tests/isolation.sql).
#   2. « appliquer » (seulement si 1 a réussi, sur main) applique à Supabase
#                   les migrations qui n'y sont pas encore, une par une, chacune
#                   dans une transaction ; puis rejoue les tests d'isolation SUR
#                   Supabase (dans une transaction annulée : aucune trace).
#
# Secret nécessaire (Settings → Secrets and variables → Actions) :
#   SUPABASE_DB_URL  l'adresse « Session pooler » de la base, mot de passe
#                    compris. Tant qu'il manque, l'étape 2 ne fait rien et le dit.
#
# Pour changer le schéma : ne jamais modifier une migration déjà appliquée ;
# en ajouter une nouvelle, datée, dans supabase/migrations/.
# ==========================================================================
name: Base de données

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/base.yml", "assets/referentiel.js", "outils/sujets-sql.mjs"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-de-donnees
  cancel-in-progress: false      # ne jamais couper une migration en cours

jobs:
  tester:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: essai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: essai
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Imiter Supabase sur la base vide
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/emulation-supabase.sql
      - name: Appliquer toutes les migrations, dans l'ordre
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $f"
            psql -v ON_ERROR_STOP=1 -q -1 -f "$f"
          done
      - name: Les 44 domaines du référentiel
        run: node outils/sujets-sql.mjs | psql -v ON_ERROR_STOP=1 -q -1
      - name: Les tests d'isolation
        run: |
          psql -v ON_ERROR_STOP=1 -q -o /dev/null -f supabase/tests/isolation.sql 2>&1 | sed 's/^psql:[^ ]* NOTICE:  //'
        shell: bash -o pipefail {0}

  appliquer:
    needs: tester
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Supabase est-il configuré
        id: pret
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::Le secret SUPABASE_DB_URL n'existe pas encore : rien n'est appliqué à Supabase."
            echo "pret=non" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Vérifie l'adresse sans jamais l'afficher : seuls l'hôte et
          # l'utilisateur (qui ne sont pas secrets) apparaissent.
          u="$SUPABASE_DB_URL"
          case "$u" in postgresql://*|postgres://*) ;; *)
            echo "::error::SUPABASE_DB_URL doit commencer par postgresql:// — copier l'adresse « Session pooler » en entier."; exit 1;; esac
          case "$u" in *"["*|*"]"*)
            echo "::error::SUPABASE_DB_URL contient encore des crochets : remplacer [YOUR-PASSWORD], crochets compris, par le mot de passe."; exit 1;; esac
          if [ "$(printf '%s' "$u" | tr -cd '@' | wc -c)" -ne 1 ]; then
            echo "::error::Le mot de passe contient un caractère spécial (@, :, /, #, ?) qui casse l'adresse. Le plus simple : en générer un nouveau, lettres et chiffres seulement."; exit 1; fi
          hote=$(printf '%s' "$u" | sed -E 's#^[^@]*@##; s#[/?].*$##')
          utilisateur=$(printf '%s' "$u" | sed -E 's#^[a-z]+://##; s#:.*$##')
          echo "Hôte : $hote — utilisateur : $utilisateur"
          case "$hote" in db.*)
            echo "::error::C'est l'adresse « Direct connection », que GitHub ne peut pas joindre. Prendre l'adresse « Session pooler » (hôte en …pooler.supabase.com)."; exit 1;; esac
          if ! erreur=$(PGCONNECT_TIMEOUT=20 psql "$u" -tA -c 'select 1' 2>&1 >/dev/null); then
            propre=$(printf '%s' "$erreur" | sed -E 's#://[^ ]*#://…#g' | tr '\n' ' ')
            echo "::error::Connexion à Supabase impossible (hôte $hote, utilisateur $utilisateur) : $propre"; exit 1
          fi
          echo "pret=oui" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.pret.outputs.pret == 'oui'
      - name: Appliquer les migrations nouvelles
        if: steps.pret.outputs.pret == 'oui'
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -c "
            create schema if not exists prive;
            create table if not exists prive.migrations (nom text primary key, appliquee_le timestamptz not null default now());
            alter table prive.migrations enable row level security;"
          for f in $(ls supabase/migrations/*.sql | sort); do
            nom=$(basename "$f")
            deja=$(psql "$SUPABASE_DB_URL" -tA -c "select 1 from prive.migrations where nom = '$nom'")
            if [ "$deja" = "1" ]; then echo "  déjà appliquée : $nom"; continue; fi
            echo "→ application : $nom"
            # La migration et son inscription, dans UNE transaction : tout ou rien.
            { cat "$f"; echo; echo "insert into prive.migrations (nom) values ('$nom');"; } \
              | psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -1
          done
      - name: Les domaines du référentiel, sur Supabase
        if: steps.pret.outputs.pret == 'oui'
        run: node outils/sujets-sql.mjs | psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -1
      - name: Les tests d'isolation, sur Supabase (transaction annulée)
        if: steps.pret.outputs.pret == 'oui'
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -o /dev/null -f supabase/tests/isolation.sql 2>&1 | sed 's/^psql:[^ ]* NOTICE:  //'
        shell: bash -o pipefail {0}
      - name: Ce qu'un visiteur non connecté voit (clé publique, comme le site)
        if: steps.pret.outputs.pret == 'oui'
        env:
          CLE: sb_publishable_zJXo39cN5hEAdCQFwm5DkA_ru99Xodj   # publique : elle est dans le site
          API: https://denpxyqbvjcwsbxjtqpd.supabase.co/rest/v1
        run: |
          echec=0
          # sujets et textes sont publics par choix : ils ne sont pas dans la liste.
          for t in registre entreprises membres_entreprise abonnements reponses plan_sujets profils invitations collectes; do
            corps=$(curl -sS "$API/$t?select=*&limit=1" -H "apikey: $CLE")
            case "$corps" in
              "[]"|*'"42501"'*) echo "ok : « $t » ne montre rien";;
              *) echo "::error::Un visiteur non connecté obtient une réponse de « $t » : ${corps:0:200}"; echec=1;;
            esac
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$API/registre" -H "apikey: $CLE" \
                 -H "Content-Type: application/json" -d '{"genre":"revue"}')
          case "$code" in 2*) echo "::error::Un visiteur non connecté a pu écrire dans le registre (HTTP $code)"; echec=1;;
                          *) echo "ok : écrire dans le registre est refusé (HTTP $code)";; esac
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$API/rpc/mes_entreprises" -H "apikey: $CLE" \
                 -H "Content-Type: application/json" -d '{}')
          case "$code" in 2*) echo "::error::Un visiteur non connecté a pu appeler mes_entreprises (HTTP $code)"; echec=1;;
                          *) echo "ok : mes_entreprises est refusé à un visiteur (HTTP $code)";; esac
          exit $echec
