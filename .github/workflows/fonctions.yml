# Vigie — la fonction serveur Supabase « vigie » et les e-mails de Supabase Auth (6 novembre 2026)
#
# 1. Déploie supabase/functions/vigie (e-mails aussitôt, paiement avec la TVA
#    affichée, résiliation et nombre de clients directement chez Stripe).
# 2. Lui donne ses secrets : la clé Stripe, la clé Brevo, l'adresse d'expédition.
# 3. Règle les e-mails de Supabase Auth (confirmation de compte, mot de passe
#    oublié) : serveur SMTP Brevo, expéditeur du site, modèles en français
#    (outils/auth-smtp.mjs).
# 4. Vérifie que la fonction répond (action « etat » : oui / non, jamais une valeur).
#
# Secrets du dépôt : SUPABASE_ACCESS_TOKEN, STRIPE_SETUP_KEY ou CLAUDE_STRIPE,
# BREVO_API_KEY, BREVO_SMTP_KEY, RECAP_EXPEDITEUR. Aucun n'est jamais affiché.
name: Fonction serveur

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "outils/courriels-gabarits.mjs", "outils/auth-smtp.mjs", ".github/workflows/fonctions.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fonctions
  cancel-in-progress: false

env:
  PROJET: denpxyqbvjcwsbxjtqpd

jobs:
  deployer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STRIPE_CLE: ${{ secrets.STRIPE_SETUP_KEY || secrets.CLAUDE_STRIPE }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
      RECAP_EXPEDITEUR: ${{ secrets.RECAP_EXPEDITEUR }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VIGIE_GITHUB_ROBOTS: ${{ secrets.VIGIE_GITHUB_ROBOTS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Les secrets sont-ils là (présence seulement)
        id: pret
        run: |
          for n in SUPABASE_ACCESS_TOKEN STRIPE_CLE BREVO_API_KEY BREVO_SMTP_KEY RECAP_EXPEDITEUR; do
            if [ -n "${!n}" ]; then echo "$n : présent"; else echo "::warning::$n : absent"; fi
          done
          # Un jeton absent ou mal choisi : un avertissement, pas un échec (pas d'e-mail d'alerte
          # de GitHub à chaque envoi) ; rien n'est déployé et le site garde le chemin d'avant.
          non() { echo "::warning::$1 Rien n'est déployé : le site continue sans la fonction serveur."; echo "pret=non" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then non "SUPABASE_ACCESS_TOKEN est absent."; fi
          # Le genre de jeton (jamais sa valeur) : il faut un jeton personnel « sbp_… ».
          t=$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')
          case "$t" in
            sbp_*) echo "SUPABASE_ACCESS_TOKEN : jeton personnel (sbp_…), bon format." ;;
            sb_secret_*) non "SUPABASE_ACCESS_TOKEN contient la clé secrète du projet (sb_secret_…), pas un jeton personnel. Créer un jeton sur supabase.com/dashboard/account/tokens (il commence par sbp_)." ;;
            sb_publishable_*) non "SUPABASE_ACCESS_TOKEN contient la clé publique du projet (sb_publishable_…). Créer un jeton sur supabase.com/dashboard/account/tokens (il commence par sbp_)." ;;
            eyJ*) non "SUPABASE_ACCESS_TOKEN contient une clé du projet (anon ou service_role, eyJ…), pas un jeton personnel. Créer un jeton sur supabase.com/dashboard/account/tokens (il commence par sbp_)." ;;
            *) non "SUPABASE_ACCESS_TOKEN n'a pas le format attendu (sbp_… ; ${#t} caractères reçus). Créer un jeton sur supabase.com/dashboard/account/tokens." ;;
          esac
          echo "SUPABASE_ACCESS_TOKEN=$t" >> "$GITHUB_ENV"
          echo "pret=oui" >> "$GITHUB_OUTPUT"
      - name: Déployer la fonction
        if: steps.pret.outputs.pret == 'oui'
        run: |
          cp outils/courriels-gabarits.mjs supabase/functions/vigie/gabarits.mjs
          npx -y supabase@2.122.0 functions deploy vigie --project-ref "$PROJET" --use-api --no-verify-jwt
      - name: Donner ses secrets à la fonction
        if: steps.pret.outputs.pret == 'oui'
        run: |
          f=$(mktemp); chmod 600 "$f"
          [ -n "$STRIPE_CLE" ] && printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_CLE" >> "$f"
          [ -n "$BREVO_API_KEY" ] && printf 'BREVO_API_KEY=%s\n' "$BREVO_API_KEY" >> "$f"
          [ -n "$RECAP_EXPEDITEUR" ] && printf 'RECAP_EXPEDITEUR=%s\n' "$RECAP_EXPEDITEUR" >> "$f"
          if [ -s "$f" ]; then npx -y supabase@2.122.0 secrets set --project-ref "$PROJET" --env-file "$f" > /dev/null && echo "Secrets posés."; fi
          rm -f "$f"
      - name: E-mails de Supabase Auth par Brevo, en français
        if: steps.pret.outputs.pret == 'oui'
        run: node outils/auth-smtp.mjs
      - name: La fonction répond-elle
        if: steps.pret.outputs.pret == 'oui'
        run: |
          sleep 5
          curl -sS -X POST "https://$PROJET.supabase.co/functions/v1/vigie" -H "content-type: application/json" -d '{"action":"etat"}'; echo
          curl -sS -X POST "https://$PROJET.supabase.co/functions/v1/vigie" -H "content-type: application/json" -d '{"action":"courriels"}'; echo
      # Le réveil des robots du matin (migration 33) : la clé GitHub, rangée dans le coffre
      # de Supabase (Vault). Elle n'est jamais affichée ; on vérifie seulement qu'elle marche.
      - name: Clé GitHub des robots du matin, dans le coffre de Supabase
        run: |
          if [ -z "$VIGIE_GITHUB_ROBOTS" ]; then
            echo "::warning::VIGIE_GITHUB_ROBOTS absent : les robots du matin gardent les horaires GitHub (souvent en retard)."; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $VIGIE_GITHUB_ROBOTS" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/recap.yml")
          if [ "$code" != "200" ]; then
            echo "::warning::La clé VIGIE_GITHUB_ROBOTS est refusée par GitHub (code $code) : vérifiez qu'elle donne accès à ce dépôt, avec « Actions : lecture et écriture »."; exit 0; fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -qtA -v cle="$VIGIE_GITHUB_ROBOTS" <<'SQL'
          select case when exists (select 1 from vault.secrets where name = 'github_robots')
            then (select vault.update_secret((select id from vault.secrets where name = 'github_robots'), :'cle'))::text
            else (select vault.create_secret(:'cle', 'github_robots', 'Vigie : lancer les robots du matin (GitHub Actions)'))::text end;
          SQL
          echo "Clé GitHub rangée dans le coffre de Supabase."
          psql "$SUPABASE_DB_URL" -qtA -c "select 'Réveils programmés : ' || coalesce(string_agg(jobname || ' (' || schedule || ' UTC)', ', '), 'aucun (migration 33 pas encore appliquée)') from cron.job where jobname like 'vigie-%'" || true
