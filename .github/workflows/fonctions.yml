# Vigie — la fonction serveur Supabase « vigie » et les e-mails de Supabase Auth (6 novembre 2026)
#
# 1. Déploie supabase/functions/vigie (e-mails aussitôt, paiement avec la TVA
#    affichée, résiliation et nombre de clients directement chez Stripe).
# 2. Lui donne ses secrets : la clé Stripe, la clé Brevo, l'adresse d'expédition.
# 3. Règle les e-mails de Supabase Auth (confirmation de compte, mot de passe
#    oublié) : serveur SMTP Brevo, expéditeur du site, modèles en français
#    (outils/auth-smtp.mjs).
# 4. Vérifie que la fonction répond (action « etat » : oui / non, jamais une valeur).
#
# Secrets du dépôt : SUPABASE_ACCESS_TOKEN, STRIPE_SETUP_KEY ou CLAUDE_STRIPE,
# BREVO_API_KEY, BREVO_SMTP_KEY, RECAP_EXPEDITEUR. Aucun n'est jamais affiché.
name: Fonction serveur

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "outils/courriels-gabarits.mjs", "outils/auth-smtp.mjs", ".github/workflows/fonctions.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fonctions
  cancel-in-progress: false

env:
  PROJET: denpxyqbvjcwsbxjtqpd

jobs:
  deployer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STRIPE_CLE: ${{ secrets.STRIPE_SETUP_KEY || secrets.CLAUDE_STRIPE }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
      RECAP_EXPEDITEUR: ${{ secrets.RECAP_EXPEDITEUR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Les secrets sont-ils là (présence seulement)
        run: |
          for n in SUPABASE_ACCESS_TOKEN STRIPE_CLE BREVO_API_KEY BREVO_SMTP_KEY RECAP_EXPEDITEUR; do
            if [ -n "${!n}" ]; then echo "$n : présent"; else echo "::warning::$n : absent"; fi
          done
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Sans SUPABASE_ACCESS_TOKEN, rien ne peut être déployé."; exit 1; fi
      - name: Déployer la fonction
        run: |
          cp outils/courriels-gabarits.mjs supabase/functions/vigie/gabarits.mjs
          npx -y supabase@2.122.0 functions deploy vigie --project-ref "$PROJET" --use-api --no-verify-jwt
      - name: Donner ses secrets à la fonction
        run: |
          f=$(mktemp); chmod 600 "$f"
          [ -n "$STRIPE_CLE" ] && printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_CLE" >> "$f"
          [ -n "$BREVO_API_KEY" ] && printf 'BREVO_API_KEY=%s\n' "$BREVO_API_KEY" >> "$f"
          [ -n "$RECAP_EXPEDITEUR" ] && printf 'RECAP_EXPEDITEUR=%s\n' "$RECAP_EXPEDITEUR" >> "$f"
          if [ -s "$f" ]; then npx -y supabase@2.122.0 secrets set --project-ref "$PROJET" --env-file "$f" > /dev/null && echo "Secrets posés."; fi
          rm -f "$f"
      - name: E-mails de Supabase Auth par Brevo, en français
        run: node outils/auth-smtp.mjs
      - name: La fonction répond-elle
        run: |
          sleep 5
          curl -sS -X POST "https://$PROJET.supabase.co/functions/v1/vigie" -H "content-type: application/json" -d '{"action":"etat"}'; echo
          curl -sS -X POST "https://$PROJET.supabase.co/functions/v1/vigie" -H "content-type: application/json" -d '{"action":"courriels"}'; echo
