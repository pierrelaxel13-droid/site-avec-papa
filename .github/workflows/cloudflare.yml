# ==========================================================================
# Pierrel & Co — la publication sur Cloudflare, avec les vrais comptes
# --------------------------------------------------------------------------
# GitHub Pages ne sait servir que des fichiers : il ne peut pas fermer
# l'application aux non-abonnés. Cloudflare Pages, si : functions/ y tourne
# (la connexion, la création du compte après le paiement, la porte de /app/).
#
# CE QU'IL FAUT, UNE FOIS (dans GitHub : Settings → Secrets and variables →
# Actions → New repository secret) :
#   CLOUDFLARE_API_TOKEN   un jeton Cloudflare (modèle « Edit Cloudflare
#                          Workers », plus « Cloudflare Pages : Edit »)
#   CLOUDFLARE_ACCOUNT_ID  l'identifiant du compte Cloudflare
#   STRIPE_SECRET          une clé Stripe RESTREINTE, en lecture seule sur
#                          Checkout Sessions, Customers et Subscriptions
# Tant que les deux premiers manquent, cette action ne fait rien et le dit.
# Tout le reste (le projet Pages, le stockage des comptes) se crée tout seul.
#
# QUAND : à chaque envoi sur main, et toutes les trois heures pour reprendre
# les relèves — pas toutes les heures, pour rester loin des plafonds gratuits.
# ==========================================================================
name: Publier sur Cloudflare

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: true

env:
  PROJET: pierrel-co
  WRANGLER: wrangler@4.20.0

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
    steps:
      - name: Cloudflare est-il configuré
        id: pret
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare n'est pas encore configuré (secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID absents) : rien n'est publié. Voir l'en-tête de .github/workflows/cloudflare.yml."
            echo "pret=non" >> "$GITHUB_OUTPUT"
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.pret.outputs.pret == 'oui'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: steps.pret.outputs.pret == 'oui'
        with:
          node-version: 22

      - name: Construire
        if: steps.pret.outputs.pret == 'oui'
        run: COMMIT_REF=$(git rev-parse HEAD) node build.mjs

      # Le stockage des comptes (KV « pierrel-comptes ») : créé au premier
      # passage, retrouvé ensuite. Son identifiant va dans wrangler.toml, qui
      # n'existe que le temps du déploiement.
      - name: Le stockage des comptes
        if: steps.pret.outputs.pret == 'oui'
        run: |
          trouve() { npx --yes $WRANGLER kv namespace list 2>/dev/null | node -e '
            let s = ""; process.stdin.on("data", (d) => s += d).on("end", () => {
              const l = JSON.parse(s.slice(s.indexOf("[")));
              const n = l.find((x) => /pierrel-comptes$/.test(x.title));
              process.stdout.write(n ? n.id : "");
            });'; }
          id=$(trouve)
          if [ -z "$id" ]; then
            npx --yes $WRANGLER kv namespace create pierrel-comptes
            id=$(trouve)
          fi
          [ -n "$id" ] || { echo "::error::Le stockage des comptes n'a pas pu être créé."; exit 1; }
          cat > wrangler.toml <<EOF
          name = "$PROJET"
          pages_build_output_dir = "_site"
          compatibility_date = "2026-10-01"

          [[kv_namespaces]]
          binding = "COMPTES"
          id = "$id"
          EOF
          cat wrangler.toml

      - name: Le projet Cloudflare Pages
        if: steps.pret.outputs.pret == 'oui'
        run: |
          npx --yes $WRANGLER pages project create "$PROJET" --production-branch=main \
            || echo "Le projet existe déjà."

      - name: La clé Stripe
        if: steps.pret.outputs.pret == 'oui'
        run: |
          if [ -z "$STRIPE_SECRET" ]; then
            echo "::warning::STRIPE_SECRET absent : la connexion et la création de compte répondront que le paiement est indisponible."
          else
            case "$STRIPE_SECRET" in
              rk_*) ;;
              *) echo "::warning::STRIPE_SECRET n'est pas une clé restreinte (rk_…). Une clé restreinte, en lecture seule, suffit et risque moins." ;;
            esac
            printf '%s' "$STRIPE_SECRET" | npx --yes $WRANGLER pages secret put STRIPE_SECRET --project-name "$PROJET"
          fi

      - name: Publier
        if: steps.pret.outputs.pret == 'oui'
        run: |
          npx --yes $WRANGLER pages deploy _site --project-name "$PROJET" --branch main \
            --commit-hash "$(git rev-parse HEAD)" --commit-message "$(git log -1 --format=%s | head -c 300)"
