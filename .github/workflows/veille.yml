# Collecte automatique des textes du Journal officiel.
# Tourne toutes les heures, met à jour data/veille-feed.json, et ne commite
# que si le fil a réellement changé.
name: Veille — collecte du Journal officiel

on:
  schedule:
    # Toutes les heures. Les workflows planifiés ne s'exécutent que depuis la
    # branche par défaut du dépôt.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      jours:
        description: "Fenêtre de collecte, en jours"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: veille-collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collecter les textes
        id: collecte
        env:
          PISTE_CLIENT_ID: ${{ secrets.PISTE_CLIENT_ID }}
          PISTE_CLIENT_SECRET: ${{ secrets.PISTE_CLIENT_SECRET }}
          PISTE_ENV: ${{ vars.PISTE_ENV }}
          ALERTE_WEBHOOK_URL: ${{ secrets.ALERTE_WEBHOOK_URL }}
        run: node scripts/collecte-jo.mjs --jours=${{ inputs.jours || '3' }}

      - name: Publier le fil mis à jour
        if: steps.collecte.outputs.modifie == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/veille-feed.json
          git commit -m "Veille : ${{ steps.collecte.outputs.inedits }} nouveau(x) texte(s) au Journal officiel"
          git push

      - name: Résumé
        run: |
          {
            echo "### Collecte du Journal officiel"
            echo ""
            echo "- Statut : \`${{ steps.collecte.outputs.statut }}\`"
            echo "- Textes inédits : ${{ steps.collecte.outputs.inedits }}"
            echo "- Fil modifié : ${{ steps.collecte.outputs.modifie }}"
          } >> "$GITHUB_STEP_SUMMARY"
