# Netlify : reconstruit et republie à chaque envoi sur la branche reliée.

# La relève du Journal officiel tourne ICI, pas sur le poste de travail : les
# machines de construction de Netlify ont un accès réseau libre, alors que
# l'environnement de développement a une politique qui refuse
# echanges.dila.gouv.fr. Il n'y a donc rien à régler ailleurs.
#
# Le « || true » n'est pas de la négligence : si la DILA est injoignable ou si
# son format a changé, le site doit quand même se publier. build.mjs sait
# construire sans relevé, et la page le dit au lieu d'inventer des textes.
[build]
  command = "node outils/jorf.mjs --jours 30 || true; node build.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Pour que la relève se refasse chaque jour sans nouvel envoi de code, créer un
# « build hook » dans Netlify (Site configuration → Build & deploy → Build
# hooks) et l'appeler une fois par jour — par la tâche planifiée de Netlify,
# ou par n'importe quel service de cron. Chaque construction relit le JO.

# Les pages sont engendrées : il faut qu'une correction se voie tout de suite.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Les polices ne changent jamais : un an, et versionnées dans le dépôt.
[[headers]]
  for = "/assets/polices/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
