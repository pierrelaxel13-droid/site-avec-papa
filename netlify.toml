# Netlify : reconstruit et republie le site à chaque envoi sur la branche reliée.
# Le dépôt peut rester privé, le site est public.

[build]
  command = "node build.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Les pages doivent être revalidées pour qu'une correction se voie tout de suite.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Feuille de style et scripts : une heure, le temps qu'une correction se propage.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
